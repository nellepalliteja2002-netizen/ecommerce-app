<div class="login-page">

  <div class="login-card">

    <!-- Logo -->
    <div class="logo-section">
      <div class="logo-icon">🥭</div>
      <h2>SURESH</h2>
      <p>MANGO FARMS</p>
    </div>

    <!-- Title -->
    <h1>Login / Sign In</h1>

    <p class="subtitle">
      Enter your mobile number to continue
    </p>

    <!-- Mobile Number -->
    <label>Mobile Number</label>

    <div class="mobile-input">

      <div class="country-code">
        +91
      </div>

      <input
        #mobile
        type="text"
        maxlength="10"
        placeholder="Enter 10 digit mobile number">

    </div>

    <!-- Send OTP Button -->
    <button
      class="otp-btn"
      (click)="sendOtp(mobile.value)">
      Send OTP
    </button>

    <!-- Divider -->
    <div class="divider">
      <span>OR</span>
    </div>

    <!-- WhatsApp Button -->
    <button
      class="whatsapp-btn"
      (click)="continueWithWhatsapp()">
      📱 Continue with WhatsApp
    </button>

    <!-- Privacy Text -->
    <p class="privacy">
      🛡️ We never share your number with anyone.
    </p>

  </div>

</div>
